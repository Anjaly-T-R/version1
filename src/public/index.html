<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .auth-section, .main-content, .video-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hidden {
            display: none !important;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #868f96 0%, #596164 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .user-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .video-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .video-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .video-card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .video-card video {
            width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .video-meta {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.2);
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: rgba(102, 126, 234, 0.05);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: rgba(102, 126, 234, 0.1);
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: rgba(102, 126, 234, 0.15);
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Music Platform</h1>
            <p>Share your music and videos with the world</p>
        </div>

        <!-- Authentication Section -->
        <div id="authSection" class="auth-section">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="form-section">
                <h2>Welcome Back!</h2>
                <p style="margin-bottom: 20px; color: #666;">Enter your Cognito credentials</p>
                
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button class="btn" onclick="login()">Login</button>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-section hidden">
                <h2>Join Us!</h2>
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="registerUsername" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="registerEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" id="registerPassword" placeholder="Create a password (min 8 chars)">
                </div>
                <button class="btn" onclick="register()">Register</button>
            </div>
        </div>

        <!-- Main Content (Hidden until logged in) -->
        <div id="mainContent" class="hidden">
            <!-- User Info -->
            <div id="userInfo" class="user-info">
                <h3>Welcome, <span id="usernameDisplay"></span>!</h3>
                <p>Email: <span id="userEmail"></span></p>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>

            <!-- Video Upload Section -->
            <div class="video-section">
                <h2>Upload Video</h2>
                <div class="upload-area" onclick="document.getElementById('videoFile').click()">
                    <div>
                        <h3>📹 Drop your video here or click to browse</h3>
                        <p>Supported formats: MP4, AVI, MOV, WMV (Max 100MB)</p>
                    </div>
                </div>
                <input type="file" id="videoFile" accept="video/*" style="display: none;" onchange="handleFileSelect(this)">
                
                <button class="btn" onclick="uploadVideo()" id="uploadBtn">Upload Video</button>
            </div>

            <!-- Videos Display -->
            <div class="video-section">
                <h2>Latest Videos</h2>
                <button class="btn btn-secondary" onclick="loadVideos()">🔄 Refresh Videos</button>
                <div id="videoGrid" class="video-grid">
                    <!-- Videos will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Alerts -->
        <div id="alerts" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>
    </div>

    <script>
        let currentUser = null;
        let authToken = null;
        const API_BASE = '/api';

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(section => section.classList.add('hidden'));
            
            if (tab === 'login') {
                document.querySelector('[onclick="switchTab(\'login\')"]').classList.add('active');
                document.getElementById('loginForm').classList.remove('hidden');
            } else {
                document.querySelector('[onclick="switchTab(\'register\')"]').classList.add('active');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        // Show alert messages
        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            const alertsContainer = document.getElementById('alerts');
            alertsContainer.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Register function - no confirmation needed
        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            if (!username || !email || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Registration successful! You can now login.');
                    // Auto-switch to login tab and fill username
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    showAlert(data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                console.error('Register error:', error);
                showAlert('Connection error. Please try again.', 'error');
            }
        }

        // Login function
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.tokens) {
                    authToken = data.tokens.IdToken;
                    currentUser = { username };
                    
                    // Update UI
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                    
                    document.getElementById('usernameDisplay').textContent = username;
                    document.getElementById('userEmail').textContent = 'Logged in via Cognito';
                    
                    showAlert('Login successful!');
                    loadVideos();
                } else {
                    showAlert(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Connection error. Please try again.', 'error');
            }
        }

        // Logout function
        function logout() {
            currentUser = null;
            authToken = null;
            
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('mainContent').classList.add('hidden');
            
            // Clear forms
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('registerUsername').value = '';
            document.getElementById('registerEmail').value = '';
            document.getElementById('registerPassword').value = '';
            
            showAlert('Logged out successfully');
        }

        // File selection handler
        function handleFileSelect(input) {
            const file = input.files[0];
            if (file) {
                showAlert(`Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`);
            }
        }

        // Upload video function
        async function uploadVideo() {
            const fileInput = document.getElementById('videoFile');

            if (!fileInput.files[0]) {
                showAlert('Please select a video file', 'error');
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            const originalText = uploadBtn.textContent;
            uploadBtn.innerHTML = '<span class="loading"></span> Uploading...';
            uploadBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);

                const response = await fetch(`${API_BASE}/videos/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Video uploaded successfully!');
                    fileInput.value = '';
                    loadVideos();
                } else {
                    showAlert(data.error || 'Upload failed', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showAlert('Upload failed. Please try again.', 'error');
            } finally {
                uploadBtn.textContent = originalText;
                uploadBtn.disabled = false;
            }
        }

        // Load videos function
        async function loadVideos() {
            try {
                const response = await fetch(`${API_BASE}/videos`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    displayVideos(data.items || []);
                } else {
                    showAlert('Failed to load videos', 'error');
                }
            } catch (error) {
                console.error('Load videos error:', error);
                showAlert('Failed to load videos', 'error');
            }
        }

        // Display videos function
        function displayVideos(videos) {
            const videoGrid = document.getElementById('videoGrid');
            
            if (videos.length === 0) {
                videoGrid.innerHTML = '<p style="text-align: center; color: #666;">No videos uploaded yet. Be the first to share!</p>';
                return;
            }

            videoGrid.innerHTML = videos.map(video => `
                <div class="video-card">
                    <h3>${video.original_name}</h3>
                    <div class="video-meta">
                        Owner: ${video.owner} | ${video.size ? (video.size / 1024 / 1024).toFixed(2) + ' MB' : ''} | ${new Date(video.created_at).toLocaleDateString()}
                    </div>
                    ${video.s3_key ? `
                        <video controls>
                            <source src="https://n12045098-mini-youtube-app.s3.ap-southeast-2.amazonaws.com/${video.s3_key}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    ` : '<p>Video processing...</p>'}
                    ${video.external_overview ? `<p>${video.external_overview}</p>` : ''}
                    <div style="margin-top: 10px;">
                        <span style="padding: 3px 8px; background: #f0f0f0; border-radius: 10px; font-size: 0.8rem;">
                            ${video.status || 'uploaded'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Music Platform Interface Loaded');
        });
    </script>
</body>
</html>
